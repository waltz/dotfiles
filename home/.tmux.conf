set -g mouse on

set -g base-index 1
setw -g pane-base-index 1

set -g status-left ""
set -g status-right ""

# --- Dracula status bar ---
set -g status-style "fg=#6272A4,bg=#282A36"

set -g window-status-format " #I:#W "
set -g window-status-style "fg=#6272A4,bg=#282A36"

set -g window-status-current-format " #I:#W "
set -g window-status-current-style "fg=#282A36,bg=#BD93F9,bold"

set -g pane-border-style "fg=#44475A"
set -g pane-active-border-style "fg=#BD93F9"

set -g message-style "fg=#F8F8F2,bg=#44475A"
set -g mode-style "reverse"

set -g default-terminal "tmux-256color"
set -g terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title,xterm-ghostty:RGB:clipboard:strikethrough:usstyle:overline:hyperlinks"
set -g terminal-overrides "xterm-ghostty:RGB:Tc"

# OSC 52 clipboard — lets tmux copy directly to your system clipboard
# (works over SSH too, no need for xclip/pbcopy hacks)
set -g set-clipboard on

# Allow programs inside tmux to send escape sequences through to the terminal
set-window-option -g allow-passthrough on

# Enable extended keys (CSI u) — fixes modifier key combos in apps like neovim
set -g extended-keys on

# Faster escape key handling (default 500ms is painful in vim/neovim)
set -g escape-time 10

# Enable focus events — lets vim/neovim detect when you switch panes
set -g focus-events on

# Vi copy mode
set -g mode-keys vi

# Don't copy on mouse drag end — just keep the selection highlighted
unbind -T copy-mode-vi MouseDragEnd1Pane

# Press y to yank selection (copies and exits copy mode)
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open new panes/windows in the current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Slow down mouse scroll (1 line per tick)
bind -T root WheelUpPane if-shell -F "#{alternate_on}" "send-keys -M" "select-pane -t=; copy-mode -e; send-keys -X -N 1 scroll-up"
bind -T root WheelDownPane if-shell -F "#{alternate_on}" "send-keys -M" "select-pane -t=; send-keys -X -N 1 scroll-down"
bind -T copy-mode-vi WheelUpPane send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect config — persist to ~/.local/state so it survives reboots
set -g @resurrect-dir '$HOME/.local/state/tmux-resurrect'
set -g @resurrect-strategy-nvim 'session'

# Continuum — auto-save periodically and auto-restore when the tmux server starts
# (this is what makes sessions survive a reboot without manual prefix+Ctrl-r)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Machine-specific overrides
source-file -q ~/.config/tmux/local.conf

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
